name: Trigger auto deployment for poetry-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/poetry-api-AutoDeployTrigger-43754727-1f7c-4120-83ed-1d1d7946d4a1.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.POETRYAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.POETRYAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.POETRYAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/poetry-api
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: poetryacr.azurecr.io
          registryUsername: ${{ secrets.POETRYAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.POETRYAPI_REGISTRY_PASSWORD }}
          containerAppName: poetry-api
          resourceGroup: rg-poetry
          imageToBuild: poetryacr.azurecr.io/poetry-api:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


